<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站已停止供应</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #f5f5f5;
            /* 完全居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "微软雅黑", sans-serif;
        }
        .box {
            text-align: center;
            color: #666666;
        }
        .tip {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .sub {
            font-size: 16px;
            margin-top: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="tip">网站已停止供应</div>
        <div class="sub">感谢您曾经的访问</div>
    </div>
</body>
</html>
